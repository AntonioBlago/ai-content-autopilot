[build-system]
requires = ["setuptools>=68.0,<78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-content-autopilot"
version = "1.0.1"
description = "Python SDK for the Visibly Content Autopilot API - Pull API client, HMAC webhook verification, and Flask Blueprint."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    { name = "Antonio Blago", email = "info@antonioblago.com" },
]
keywords = ["cms", "content", "autopilot", "webhook", "api", "seo", "flask"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "flask>=2.3.0",
    "requests>=2.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
]

[project.urls]
Homepage = "https://www.antonioblago.com/developers"
Documentation = "https://www.antonioblago.com/developers"
Repository = "https://github.com/antonioblago/ai-content-autopilot"

[tool.setuptools.packages.find]
include = ["ai_content_autopilot*"]